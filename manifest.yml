modules:
  jira:issuePanel:
    - key: change-management-revisor-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Change Management Revisor
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      displayConditions:
        and:
          projectKey: GML
          issueType: '[System] Mudança'
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    - read:jira-work
    # Grava o feedback do usuário nos campos de avaliação do agente.
    - write:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/d6044dde-8d1a-4b89-b7da-807273ec6d4d
